[workspace]
resolver = "2"

members = [
	"authorize-service",
	"execute-service",
	"client",
	"block-parser",
]

[workspace.dependencies]

[workspace.dependencies.snarkvm]
#git = "https://github.com/ProvableHQ/snarkVM.git"
#rev = "57bfe32"
version = "=1.5.0"
#snarkvm = { path = "../snarkVM" }

[profile.release]
opt-level = 3
lto = "thin"
incremental = true

[profile.bench]
opt-level = 3
debug = false
rpath = false
lto = "thin"
incremental = true
debug-assertions = false

[profile.dev]
opt-level = 3
lto = "thin"
incremental = true

[profile.test]
opt-level = 3
lto = "thin"
incremental = true
debug = true
debug-assertions = true
